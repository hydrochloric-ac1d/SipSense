# gradle-wrapper.properties
#
# Configures the Gradle Wrapper to download and use a specific Gradle version.
# This ensures all developers and CI systems use the same Gradle version,
# providing consistent and reproducible builds.
#
# Gradle 8.9 is compatible with AGP 8.6.0 used in this project.
#
# Regenerated 2026-09-30 by the Gradle 8.9 `wrapper` task. The task rewrites this
# file and strips comments, so restore this header if it is regenerated again.
# `validateDistributionUrl` makes the wrapper verify the distribution it downloads.

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
