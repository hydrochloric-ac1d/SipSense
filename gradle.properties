# gradle.properties
#
# Project-wide Gradle settings for SipSense.
# These properties are read by Gradle during every build.
#
# For more details on configuring Gradle:
# https://docs.gradle.org/current/userguide/build_environment.html

# ── AndroidX Migration ────────────────────────────────────────────────
# Ensures all Android support libraries use the AndroidX namespace.
# Required for modern Android development (replaces legacy support libraries).
android.useAndroidX=true

# ── Kotlin Code Style ────────────────────────────────────────────────
# Sets the Kotlin code style to the official conventions.
kotlin.code.style=official

# ── JVM Configuration ────────────────────────────────────────────────
# Allocates sufficient memory to the Gradle daemon for smooth builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8


# ── Non-transitive R Classes ─────────────────────────────────────────
# Reduces build times and prevents resource ID conflicts between modules.
android.nonTransitiveRClass=true
